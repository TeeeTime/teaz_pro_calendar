# Activate with SPRING_PROFILES_ACTIVE=prod.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.teaz.pro/realms/teazpro

# Database: the shared Postgres server on the VPS, database and user "calendar".
# Connection only from the environment (.env, see README), never from this file:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
# Schema by Flyway (db/migration) as the database's owner.

# The real iCloud. CALENDAR_ENCRYPTION_KEY comes from the environment (.env, see
# README); without it the backend doesn't start.
calendar.sample=false

# Apps allowed to read /api/events/today from the browser (comma-separated).
calendar.cors.allowed-origins=https://portal.teaz.pro
