spring.application.name=calendar

# Local dev: file-based H2 in PostgreSQL mode, so no Docker or database install is
# needed (see teaz_pro/docs/TECH_STACK.md). Prod uses Postgres from compose.yml.
spring.datasource.url=jdbc:h2:file:./data/calendar-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Errors as RFC 9457 problem details, so the UI can show their "detail".
spring.mvc.problemdetails.enabled=true

# Local dev: made-up calendars instead of iCloud, so it stays offline like the
# mock auth (any Apple ID works; the password "wrong" is rejected, to try that
# path). To use the real iCloud locally, set CALENDAR_SAMPLE=false in the
# backend's environment.
calendar.sample=true
# Key for the stored app-specific passwords: base64 of 32 random bytes
# (openssl rand -base64 32). Unset = a fixed, public dev key; prod refuses that.
calendar.encryption-key=
# Background sync per account; reading events starts one when the last is older than stale-after.
calendar.sync-interval=15m
calendar.stale-after=2m
calendar.refresh-cooldown=30s
# Recurring events are stored as single occurrences in this window around today.
calendar.expand-past=P2Y
calendar.expand-future=P2Y
