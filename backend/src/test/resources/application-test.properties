# Tests: an in-memory database per Spring context, sample calendars unless a test
# points calendar.caldav-url at its fake iCloud. Combined with "prod" to test the
# real security rules without Postgres or the network.
spring.datasource.url=jdbc:h2:mem:calendar-test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
calendar.sample=true
calendar.encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
# Tests sync themselves, never in the background or on reading.
calendar.sync-check=1d
calendar.stale-after=3650d
